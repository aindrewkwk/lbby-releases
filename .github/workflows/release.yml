# ─────────────────────────────────────────────────────────────────────────────
# THIS FILE BELONGS IN THE PUBLIC RELEASES REPO, NOT THIS ONE.
#
# Copy it to:  aindrewkwk/lbby-releases  →  .github/workflows/release.yml
#
# It checks out the PRIVATE source (aindrewkwk/lbby-app) at a chosen tag,
# builds the signed installers, and publishes them — together with the
# updater manifest latest.json — as a public GitHub Release in THIS
# (lbby-releases) repo. Because tauri-action runs here, latest.json's asset
# URLs correctly point at the public repo, which is what the app fetches.
#
# ── Required secrets (set them in lbby-releases → Settings → Secrets → Actions)
#   SOURCE_REPO_TOKEN                    PAT (classic: repo scope, or fine-grained
#                                        with read access to aindrewkwk/lbby-app
#                                        Contents) — used only to check out the
#                                        private source.
#   TAURI_SIGNING_PRIVATE_KEY           Contents of your lbby.key private key.
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  The key password.
#
# ── How to cut a release
#   1. Tag the private repo as usual, e.g. `git tag v0.1.6 && git push --tags`.
#   2. In lbby-releases → Actions → "Release" → Run workflow, enter `v0.1.6`.
# ─────────────────────────────────────────────────────────────────────────────
name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Source tag in aindrewkwk/lbby-app to build (e.g. v0.1.6)"
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
            label: macOS (Apple Silicon)
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
            label: macOS (Intel)
          - platform: windows-latest
            args: ""
            label: Windows
          - platform: ubuntu-22.04
            args: ""
            label: Linux

    runs-on: ${{ matrix.platform }}
    name: Build (${{ matrix.label }})

    steps:
      - name: Checkout private source
        uses: actions/checkout@v4
        with:
          repository: aindrewkwk/lbby-app
          ref: ${{ github.event.inputs.tag }}
          token: ${{ secrets.SOURCE_REPO_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      - name: Pin NPM @tauri-apps versions to match Rust crates
        run: |
          npm install --save-exact \
            @tauri-apps/api@2.9.5 \
            @tauri-apps/plugin-dialog@2.6.0 \
            @tauri-apps/plugin-process@2.2.0 \
            @tauri-apps/plugin-updater@2.9.0

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.event.inputs.tag }}
          releaseName: "Lbby ${{ github.event.inputs.tag }}"
          releaseBody: |
            See the changelog below for what's new in this release.

            ## Downloads

            | Platform | File |
            |---|---|
            | macOS Apple Silicon | `Lbby_*_aarch64.dmg` |
            | macOS Intel | `Lbby_*_x64.dmg` |
            | Windows | `Lbby_*_x64-setup.exe` |
            | Linux (AppImage) | `lbby_*_amd64.AppImage` |
            | Linux (Debian) | `lbby_*_amd64.deb` |

            The app is unsigned during beta:
            - **Windows SmartScreen:** click *More info → Run anyway*.
            - **macOS Gatekeeper:** right-click the app → *Open* → *Open*.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
