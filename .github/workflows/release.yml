# ─────────────────────────────────────────────────────────────────────────────
# THIS FILE BELONGS IN THE PUBLIC RELEASES REPO, NOT THIS ONE.
#
# Copy it to:  aindrewkwk/lbby-releases  →  .github/workflows/release.yml
#
# It checks out the PRIVATE source (aindrewkwk/lbby-app) at a chosen tag,
# builds the signed installers, and publishes them — together with the
# updater manifest latest.json — as a public GitHub Release in THIS
# (lbby-releases) repo. Because tauri-action runs here, latest.json's asset
# URLs correctly point at the public repo, which is what the app fetches.
#
# ── Required secrets (set them in lbby-releases → Settings → Secrets → Actions)
#   SOURCE_REPO_TOKEN                    PAT (classic: repo scope, or fine-grained
#                                        with read access to aindrewkwk/lbby-app
#                                        Contents) — used only to check out the
#                                        private source.
#   TAURI_SIGNING_PRIVATE_KEY           Contents of your lbby.key private key.
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  The key password.
#
# ── How to cut a release
#   1. Tag the private repo as usual, e.g. `git tag v0.1.6 && git push --tags`.
#   2. In lbby-releases → Actions → "Release" → Run workflow, enter `v0.1.6`.
# ─────────────────────────────────────────────────────────────────────────────
name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Source tag in aindrewkwk/lbby-app to build (e.g. v0.1.6)"
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
            label: Windows
          - platform: ubuntu-22.04
            args: ""
            label: Linux

    runs-on: ${{ matrix.platform }}
    name: Build (${{ matrix.label }})

    steps:
      - name: Checkout private source
        uses: actions/checkout@v4
        with:
          repository: aindrewkwk/lbby-app
          ref: ${{ github.event.inputs.tag }}
          token: ${{ secrets.SOURCE_REPO_TOKEN }}

      - name: Validate version matches tag
        shell: bash
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          # Validate tag format (vX.Y.Z only — reject anything with shell metacharacters)
          if ! echo "$INPUT_TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "❌ Tag '$INPUT_TAG' does not match expected format vX.Y.Z"
            exit 1
          fi

          TAG_VERSION="${INPUT_TAG#v}"

          CARGO_VERSION=$(grep '^version' src-tauri/Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          PKG_VERSION=$(grep '"version"' package.json | head -1 | sed 's/.*"\(.*\)".*/\1/')
          TAURI_VERSION=$(grep '"version"' src-tauri/tauri.conf.json | head -1 | sed 's/.*"\(.*\)".*/\1/')

          echo "Tag version:       ${TAG_VERSION}"
          echo "Cargo.toml:        ${CARGO_VERSION}"
          echo "package.json:      ${PKG_VERSION}"
          echo "tauri.conf.json:   ${TAURI_VERSION}"

          FAILED=0
          if [ "${CARGO_VERSION}" != "${TAG_VERSION}" ]; then
            echo "❌ Cargo.toml version (${CARGO_VERSION}) does not match tag (${TAG_VERSION})"
            FAILED=1
          fi
          if [ "${PKG_VERSION}" != "${TAG_VERSION}" ]; then
            echo "❌ package.json version (${PKG_VERSION}) does not match tag (${TAG_VERSION})"
            FAILED=1
          fi
          if [ "${TAURI_VERSION}" != "${TAG_VERSION}" ]; then
            echo "❌ tauri.conf.json version (${TAURI_VERSION}) does not match tag (${TAG_VERSION})"
            FAILED=1
          fi
          if [ "${CARGO_VERSION}" != "${PKG_VERSION}" ] || [ "${PKG_VERSION}" != "${TAURI_VERSION}" ]; then
            echo "❌ Version sources disagree with each other"
            FAILED=1
          fi

          if [ "${FAILED}" -eq 1 ]; then
            echo ""
            echo "ABORT: Version mismatch detected. Bump version in all three files before tagging."
            exit 1
          fi

          echo "✅ All version sources match tag ${INPUT_TAG}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: build-${{ matrix.platform }}

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.event.inputs.tag }}
          releaseName: "Lbby ${{ github.event.inputs.tag }}"
          releaseBody: |
            See the changelog below for what's new in this release.

            ## Downloads

            | Platform | File |
            |---|---|
            | Windows | `Lbby_*_x64-setup.exe` |
            | Linux (AppImage) | `lbby_*_amd64.AppImage` |
            | Linux (Debian) | `lbby_*_amd64.deb` |

            The app is unsigned during beta:
            - **Windows SmartScreen:** click *More info → Run anyway*.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
