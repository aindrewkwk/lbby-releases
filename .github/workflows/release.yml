name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Source tag in aindrewkwk/lbby-app to build (e.g. v0.1.6)"
        required: true

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-22.04
    name: Pre-publish verification
    steps:
      - name: Checkout private source
        uses: actions/checkout@v4
        with:
          repository: aindrewkwk/lbby-app
          ref: ${{ github.event.inputs.tag }}
          token: ${{ secrets.SOURCE_REPO_TOKEN }}

      - name: Validate version matches tag
        shell: bash
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if ! echo "$INPUT_TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+|-beta\.[0-9]+)?$'; then
            echo "❌ Tag format invalid"
            exit 1
          fi
          TAG_VERSION="${INPUT_TAG#v}"
          TAG_VERSION="${TAG_VERSION%-rc.*}"
          TAG_VERSION="${TAG_VERSION%-beta.*}"
          CARGO_VERSION=$(grep '^version' src-tauri/Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          PKG_VERSION=$(grep '"version"' package.json | head -1 | sed 's/.*"\(.*\)".*/\1/')
          TAURI_VERSION=$(grep '"version"' src-tauri/tauri.conf.json | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "Tag: $TAG_VERSION | Cargo: $CARGO_VERSION | pkg: $PKG_VERSION | tauri: $TAURI_VERSION"
          FAILED=0
          [ "$CARGO_VERSION" != "$TAG_VERSION" ] && echo "❌ Cargo mismatch" && FAILED=1
          [ "$PKG_VERSION" != "$TAG_VERSION" ] && echo "❌ pkg mismatch" && FAILED=1
          [ "$TAURI_VERSION" != "$TAG_VERSION" ] && echo "❌ tauri mismatch" && FAILED=1
          [ "$FAILED" -eq 1 ] && exit 1
          echo "✅ All versions match"

      - name: Verify lbby-core rev integrity
        shell: bash
        run: |
          CORE_REV=$(grep -A1 'lbby-core' src-tauri/Cargo.toml | grep 'rev' | sed 's/.*"\([a-f0-9]*\)".*/\1/')
          echo "Pinned core rev: $CORE_REV"
          [ -z "$CORE_REV" ] && echo "❌ No core rev" && exit 1
          LOCK_SOURCE=$(grep -A2 'lbby-core' src-tauri/Cargo.lock | grep 'source' | head -1)
          echo "$LOCK_SOURCE" | grep -q "$CORE_REV" && echo "✅ Core rev OK" || (echo "❌ Core rev mismatch" && exit 1)

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Frontend build
        run: npm run build

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
            label: macOS
          - platform: ubuntu-22.04
            args: ""
            label: Linux
          - platform: windows-latest
            args: ""
            label: Windows

    runs-on: ${{ matrix.platform }}
    name: Build (${{ matrix.label }})

    steps:
      - name: Checkout private source
        uses: actions/checkout@v4
        with:
          repository: aindrewkwk/lbby-app
          ref: ${{ github.event.inputs.tag }}
          token: ${{ secrets.SOURCE_REPO_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: build-${{ matrix.platform }}

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.event.inputs.tag }}
          releaseName: "Lbby ${{ github.event.inputs.tag }}"
          releaseBody: |
            ## Downloads

            | Platform | File |
            |---|---|
            | macOS (Apple Silicon) | `Lbby_*_aarch64.dmg` |
            | Linux (x86_64) | `Lbby_*_amd64.deb` / `Lbby_*_amd64.AppImage` |
            | Windows | `Lbby_*_x64-setup.exe` |
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
